[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yoruba-tone-lab"
version = "0.1.0"
description = "Reproducible Yoruba tone analysis and audio preparation"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "praat-parselmouth>=0.4.6",
]

[project.optional-dependencies]
reports = ["matplotlib>=3.7"]

[project.scripts]
yoruba-tone-lab = "tone_lab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
