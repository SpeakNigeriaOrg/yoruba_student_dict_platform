name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  # Lets a deploy be started by hand from the Actions tab, against any ref.
  #
  # Added during a GitHub Actions outage that throttled webhook deliveries: pushes landed on
  # main and triggered no runs at all, and re-running an earlier run rebuilds that run's OWN
  # commit - so there was no way to deploy the newest one. A push-only trigger means the ability
  # to deploy depends on the same webhook path that had failed.
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    # workflow_dispatch must be listed here too - this condition is what actually gates the job,
    # and omitting it would leave the new trigger silently doing nothing.
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install all workspace dependencies
        run: npm ci
      - name: Build api (builds shared first, then api's own dist)
        run: npm run build:api
      - name: Build app (builds shared first, then app's own dist)
        run: npm run build:app
      # Oryx runs `npm install --production` inside api/ with no lockfile, and npm builds its
      # ideal tree with devDependencies INCLUDED before pruning them - so api's dev tooling is
      # resolved on every deploy even though none of it ships. On 2026-09-03 that crashed
      # Oryx's npm (10.9.4) while loading vitest's peer set, with no change on our side:
      # `vitest` alone in a devDependencies block reproduces it under that npm, even pinned to
      # the version that had deployed successfully days before, so what moved was the peer
      # graph on the registry. See scripts/vendorSharedForApi.mjs, which does the same for the
      # vendored copy of shared - both had to go, either one alone still crashed it.
      #
      # This edits the checked-out file only, never the repo, and runs after every build step
      # that could want those packages. What Oryx installs is the production Function app,
      # where devDependencies mean nothing anyway.
      - name: Keep api's devDependencies out of Oryx's install
        run: cd api && npm pkg delete devDependencies

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_RIVER_070B8550F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "app/dist" # already-built app content - see custom build steps above
          api_location: "api" # api's own dist is pre-built above; Oryx installs api's node_modules itself (see api/package.json's file:../shared dependency)
          output_location: "" # app_location IS the built output already; nothing further to append
          skip_app_build: true
          # No skip_api_build here (unsupported by this action version) -
          # Oryx runs its own npm install/build inside api/. This now
          # works correctly: api/package.json points at shared via
          # "file:../shared" (a plain relative path, resolved without any
          # npm-workspace detection or registry lookup), rather than the
          # bare "*" workspace-style version spec that 404'd when Oryx's
          # isolated install phase failed to recognize the monorepo root.
          ###### End of Repository/Build Configurations ######

      # Oryx runs inside a Docker container, where its npm writes crash logs to
      # /github/home/.npm/_logs - a path that does not exist on the runner and dies with the
      # container. It IS mounted from the host, though, so these two steps read the host side
      # of that same mount (container /github/home is runner
      # /home/runner/work/_temp/_github_home) while the job is still alive.
      #
      # Added while chasing "Cannot read properties of null (reading 'edgesOut')" from Oryx's
      # own `npm install --production` inside api/. The build log prints only that one line
      # and points at a debug log nobody could reach; the trace in it names which node of the
      # dependency tree npm choked on, which is the difference between a guess and a fix.
      #
      # if: always() is what makes them run at all - the deploy step above has already failed
      # by this point, and without it the job stops there and takes the evidence with it. The
      # job still ends red; this only adds the log to it.
      - name: Show Oryx's npm debug log
        if: always()
        run: |
          ls -la /home/runner/work/_temp/_github_home/.npm/_logs/ || true
          tail -n 200 /home/runner/work/_temp/_github_home/.npm/_logs/*-debug-0.log || true

      - name: Upload Oryx's npm debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-debug-logs
          path: /home/runner/work/_temp/_github_home/.npm/_logs/
          if-no-files-found: warn

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_RIVER_070B8550F }}
          action: "close"
