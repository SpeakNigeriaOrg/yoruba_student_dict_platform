name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  # Lets a deploy be started by hand from the Actions tab, against any ref.
  #
  # Added during a GitHub Actions outage that throttled webhook deliveries: pushes landed on
  # main and triggered no runs at all, and re-running an earlier run rebuilds that run's OWN
  # commit - so there was no way to deploy the newest one. A push-only trigger means the ability
  # to deploy depends on the same webhook path that had failed.
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    # workflow_dispatch must be listed here too - this condition is what actually gates the job,
    # and omitting it would leave the new trigger silently doing nothing.
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # 20 here builds the app and the api's dist; app/public/staticwebapp.config.json's
          # platform.apiRuntime pins the same version for the FUNCTIONS RUNTIME, which is a
          # separate thing and was never pinned at all. Left unset, Azure infers it from
          # whatever Node its build image ships - and on 2026-09-03 that image moved to Node
          # 22.22.0 / npm 10.9.4 (both named in Oryx's own crash log), which is when deploys
          # started failing and then shipping an API where no function registers.
      # --no-audit is not cosmetic: `npm ci` spent SIX MINUTES on run #84 (01:58:08 to
      # 02:04:09), and the "This endpoint is being retired ... #tag/Audit" notice lands in
      # the same second the install finally reports. npm audits at the end of ci, and that
      # endpoint is being retired and hanging. The install itself is 194 packages, seconds
      # of work. Vulnerability scanning belongs in Dependabot, not in the deploy path.
      - name: Install all workspace dependencies
        run: npm ci --no-audit --no-fund
      # Assembles api-deploy/ as well as api/dist - see scripts/buildApiDeploy.mjs. api/
      # itself cannot be uploaded: it is a workspace, so installing in it hoists every
      # dependency to the monorepo root and ships an app with no @azure/functions in it.
      - name: Build and package api (builds shared first, then assembles api-deploy/)
        run: npm run package:api
      - name: Build app (builds shared first, then app's own dist)
        run: npm run build:app
      # The guard that would have caught the dead deploy of 2026-09-03 before it shipped.
      # A directory upload succeeds whether or not the app inside it can run, so this loads
      # it exactly as the Functions host does - every app.http registration executes - and
      # fails the job if a dependency is missing. Cheap, and it fails LOUD instead of
      # deploying a site where every route 403s.
      # api-deploy/ is what actually deploys, so loading it here exercises the very tree that
      # ships - a missing dependency or bad import fails the job instead of the site.
      - name: Verify the api's compiled output actually loads
        run: |
          cd api-deploy
          npm install --omit=dev --no-audit --no-fund
          node --input-type=module -e "await import('./dist/index.js')"

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_RIVER_070B8550F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "app/dist" # already-built app content - see custom build steps above
          api_location: "api-deploy" # NOT api/ - see the packaging step above. api/ is a workspace
          # member, so Oryx's `npm install` inside it finds the monorepo root, hoists every
          # dependency there and empties api/node_modules - shipping a Function app with no
          # @azure/functions to import. Confirmed in run #93's Oryx log: "found workspace root
          # at /github/workspace" followed by 46 REMOVE lines. api-deploy/ is not in the
          # workspaces globs, so npm installs into it normally.
          output_location: "" # app_location IS the built output already; nothing further to append
          skip_app_build: true
          # skip_app_build only: the app is prebuilt above. Oryx still installs inside
          # api-deploy/, which is what we want - it just resolves locally now.
          ###### End of Repository/Build Configurations ######

      # A green deploy has twice now meant a dead site: the upload succeeds, no function
      # registers, and the platform's rolesSource call to /api/GetRoles gets nothing - which
      # leaves every signed-in account with no roles and every /api/* route returning 403.
      # Nothing in the build notices. This asks the deployed site the one question that
      # matters, and turns "green build, broken site" into a red build.
      #
      # 404 is the platform's own not-found page, i.e. no function is answering. Any other
      # status means the app is up (GetRoles is a POST endpoint, so a GET reaching it is a
      # success signal here, not a failure).
      # A green deploy has twice now meant a dead site: the upload succeeds, no
      # function registers, and the platform's rolesSource call to /api/GetRoles gets
      # nothing - which leaves every signed-in account with no roles and every /api/*
      # route returning 403. Nothing in the build notices.
      #
      # This asks /api/health, which exists for exactly this (see
      # api/src/handlers/health.ts). Every other /api route carries an allowedRoles
      # rule, so CI cannot call it; the previous version of this step asked
      # /api/GetRoles instead, the only role-free route - but that is the platform's
      # own rolesSource, which answers external callers with its own 404 whether the
      # function registered or not. It therefore failed identically on a healthy
      # deploy and a dead one, and reported a day of working deploys as broken.
      #
      # /api/health returns 503 when the host is up but Postgres is unreachable, so a
      # missing DATABASE_URL app setting fails the build rather than shipping quietly.
      - name: Smoke-test the deployed API
        if: success()
        run: |
          SITE=https://mango-river-070b8550f.7.azurestaticapps.net
          for i in $(seq 1 20); do
            body=$(curl -fsS -m 10 "$SITE/api/health" 2>/dev/null || echo '')
            if [ -n "$body" ]; then
              echo "$body"
              echo "API is answering and the database is reachable."
              deployed=$(printf '%s' "$body" | jq -r '.commit')
              if [ "$deployed" != "$GITHUB_SHA" ]; then
                echo "::warning::/api/health reports commit $deployed, expected $GITHUB_SHA - the deploy may not have rolled over yet."
              fi
              exit 0
            fi
            echo "attempt $i: /api/health did not return a healthy response yet"
            sleep 15
          done
          echo "::error::/api/health never returned a healthy response. Either no function registered, or the API cannot reach Postgres - fetch it directly for the reason:"
          curl -sS -m 10 -o - -w '\nHTTP %{http_code}\n' "$SITE/api/health" || true
          exit 1

      # Oryx runs inside a Docker container, where its npm writes crash logs to
      # /github/home/.npm/_logs - a path that does not exist on the runner and dies with the
      # container. It IS mounted from the host, though, so these two steps read the host side
      # of that same mount (container /github/home is runner
      # /home/runner/work/_temp/_github_home) while the job is still alive.
      #
      # Added while chasing "Cannot read properties of null (reading 'edgesOut')" from Oryx's
      # own `npm install --production` inside api/. The build log prints only that one line
      # and points at a debug log nobody could reach; the trace in it names which node of the
      # dependency tree npm choked on, which is the difference between a guess and a fix.
      #
      # if: always() is what makes them run at all - the deploy step above has already failed
      # by this point, and without it the job stops there and takes the evidence with it. The
      # job still ends red; this only adds the log to it.
      - name: Show Oryx's npm debug log
        if: always()
        run: |
          ls -la /home/runner/work/_temp/_github_home/.npm/_logs/ || true
          tail -n 200 /home/runner/work/_temp/_github_home/.npm/_logs/*-debug-0.log || true

      - name: Upload Oryx's npm debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-debug-logs
          path: /home/runner/work/_temp/_github_home/.npm/_logs/
          if-no-files-found: warn

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_RIVER_070B8550F }}
          action: "close"
